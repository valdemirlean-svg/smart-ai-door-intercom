# Smart AI Door Intercom
# ESP32-S3 Zero
# LD2410C mmWave radar
# INMP441 microphone
# PCM5102A DAC
# PAM8406 amplifier

esphome:
  name: porteiro-esp32-zero
  friendly_name: Porteiro Monstro
  platformio_options:
    board_build.arduino.partitions: min_spiffs.csv
  on_boot:
    priority: -10
    then:
      - logger.log: "Porteiro inicializado e pronto para o Gemini!"

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: arduino

psram:
  mode: quad
  speed: 80MHz

time:
  - platform: homeassistant
    id: ha_time

# =========================
# REDE, LOG, API, OTA
# =========================
wifi:
  networks:
    - ssid: !secret wifi_ssid_principal
      password: !secret wifi_password_principal
    
    - ssid: !secret wifi_ssid_reserva
      password: !secret wifi_password_reserva

  # Configurações de estabilidade para evitar reboots desnecessários
  fast_connect: true
  reboot_timeout: 0s  # Importante: evita que o ESP32 reinicie se o Wi-Fi cair por um minuto

  ap:
    ssid: "Porteiro-Zero-Fallback"
    password: "12345678"

captive_portal:

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

# =========================
# SCRIPT DE FLUXO PRINCIPAL
# =========================
script:
  - id: iniciar_fluxo
    mode: restart
    then:
      # 1. Checa se o Google está online
      - if:
          condition:
            binary_sensor.is_on: google_online
          then:
            # --- FLUXO ONLINE ---
            - logger.log: "Internet OK. Iniciando Gemini..."
            - light.turn_on:
                id: led_monstrinho
                brightness: 100%
            
            # Toca a saudação inicial do Piper
            - media_player.play_media:
                id: porteiro_media_player
                media_url: "http://192.168.3.XXX:8123/local/ola_ajudar.mp3"
            
            # Aguarda o áudio terminar para não "atropelar" o microfone
            - wait_until:
                media_player.is_idle: porteiro_media_player
            
            # Abre o microfone para o Gemini
            - delay: 3500ms
            - voice_assistant.start
            
          else:
            # --- FLUXO OFFLINE ---
            - logger.log: "Google offline! Avisando visitante..."
            # Efeito visual de erro
            - light.turn_on:
                id: led_monstrinho
                brightness: 100%
            
            # Áudio de contingência
            - media_player.play_media:
                id: porteiro_media_player
                media_url: "http://192.168.3.XXX:8123/local/sistema_offline.mp3"
            
            - delay: 5s
            - light.turn_off: led_monstrinho
            
  # =========================
  # SCRIPT FORA DO HORÁRIO
  # =========================
  - id: modo_nao_perturbe
    then:
      - logger.log: "Modo não perturbe ativo — fora do horário"
      - light.turn_on:
          id: led_monstrinho
          brightness: 30%
      - media_player.play_media:
          id: porteiro_media_player
          media_url: "http://192.168.3.XXX:8123/local/fora_do_horario.mp3"
      - delay: 5s
      - light.turn_off: led_monstrinho

# =========================
# I2S BUS
# =========================
i2s_audio:
  - id: bus_mic
    i2s_bclk_pin: GPIO12 # SCK do INMP441
    i2s_lrclk_pin: GPIO13 # WS do INMP441
  - id: bus_speaker
    i2s_bclk_pin: GPIO1 # BCK do PCM5102A
    i2s_lrclk_pin: GPIO4 # LRCK do PCM5102A

# =========================
# MICROFONE
# =========================
microphone:
  - platform: i2s_audio
    id: porteiro_mic
    i2s_audio_id: bus_mic
    i2s_din_pin: GPIO11 # SD do INMP441
    adc_type: external
    pdm: false
    bits_per_sample: 16bit
    channel: left
    sample_rate: 16000

# =========================
# MEDIA PLAYER
# =========================
media_player:
  - platform: i2s_audio
    name: "Porteiro Media Player"
    id: porteiro_media_player
    i2s_audio_id: bus_speaker
    i2s_dout_pin: GPIO2 # DIN do PCM5102A
    dac_type: external
    mode: mono

# =========================
# VOICE ASSISTANT
# =========================
voice_assistant:
  id: va
  microphone: porteiro_mic
  media_player: porteiro_media_player
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 15dBFS
  volume_multiplier: 3.0

  on_listening:
    - logger.log: "Ouvindo o visitante..."
    - light.turn_on: led_monstrinho

  on_stt_end:
    - logger.log:
        format: "Texto reconhecido: %s"
        args: [x]

  on_tts_start:
    - logger.log: "Gemini está respondendo..."
    - light.turn_off: led_monstrinho

  on_tts_end:
    - logger.log: "Resposta finalizada. Aguardando próximo comando."

# =========================
# SENSORES DE STATUS DO HA
# =========================
binary_sensor:
  - platform: status
    id: api_status
    name: "Porteiro Zero Online"

  # Importa o sensor de ping que você já tem no HA
  - platform: homeassistant
    id: google_online
    entity_id: binary_sensor.internet_google_ping

  # =========================
  # RADAR LD2410C
  # =========================
  - platform: gpio
    id: radar_presenca
    name: "Radar Porteiro"
    pin:
      number: GPIO9
      mode: INPUT_PULLDOWN
    device_class: presence

  # =========================
  # BOTÃO DO PORTEIRO
  # =========================
  - platform: gpio
    name: "Botao do Porteiro"
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 2s
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                auto now = id(ha_time).now();
                if (!now.is_valid()) return false;

                int h = now.hour;
                return (h >= 23 || h < 7);
            then:
              - script.execute: modo_nao_perturbe
            else:
              - script.execute: iniciar_fluxo

# =========================
# RELÉ PARA ABERTURA
# =========================
switch:
  - platform: gpio
    id: rele_portao
    name: "Trava do Portão"
    icon: "mdi:door-closed-lock"
    pin:
      number: GPIO7
      inverted: false
      mode: OUTPUT
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 1s
      - switch.turn_off: rele_portao

# =========================
# LED PARA FEEDBACK DO MICROFONE
# =========================
output:
  - platform: ledc
    pin: GPIO8
    id: led_botao_output

light:
  - platform: monochromatic
    name: "Monstrinho LED Botão"
    output: led_botao_output
    id: led_monstrinho
    effects:
      - pulse:
          name: "Analisando"
          transition_length: 500ms
          update_interval: 500ms
